site_name: Notas de Sistema — JDL
site_author: Juan David Leongómez
site_description: Notas personales para administrar servidor Ubuntu y PC CachyOS
repo_url: https://github.com/jdleongomez/sysadmin-notes
repo_name: jdleongomez/sysadmin-notes

theme:
  name: material
  language: es
  palette:
    - scheme: dracula
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/dracula.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - Linux:
    - Comandos: linux/comandos.md
  - CachyOS:
    - Configuración: cachyos/configuracion.md
    - Acer Aspire 7 — BIOS y arranque: cachyos/acer-aspire-bios.md
  - Servidor Ubuntu:
    - Shiny & RStudio: ubuntu-server/shiny-rstudio.md
    - Open WebUI & Ollama: ubuntu-server/open-webui-ollama.md
    - UPS (apcupsd): ubuntu-server/apcupsd.md
  - Syncthing:
      - Configuración: syncthing/configuracion.md